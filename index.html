<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 { font-size: 25px; }
    #reader {
      width: 100%;
      margin: 18px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #202020;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; }
    #next { display: none; background: #176b43; }
    #status {
      padding: 12px;
      background: white;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
    .note { font-size: 13px; color: #666; }
  </style>
</head>

<body>
  <h1>Barcode Scanner</h1>
  <p>Point your phone camera at a product barcode.</p>

  <div id="reader"></div>

  <button id="start">Start scanner</button>
  <button id="next">Scan next product</button>

  <p id="status">Ready to start.</p>
  <p class="note">Each successful scan is saved as a new row in Google Sheets.</p>

  <script>
    // PASTE YOUR DEPLOYED APPS SCRIPT URL BELOW.
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzQmoYbya1sRJh3hSN8sgV629V0cY4XrUkYeGxxqECXAB91HyiuNPdRafNTC_3hBri8/exec";

    // USE THE SAME VALUE AS API_KEY IN Code.gs.
    const API_KEY =
      "uhdauih!^&@ndadknhduewu&@#*@#*uwhjnadnnj##!3";

    const statusBox = document.getElementById("status");
    const startButton = document.getElementById("start");
    const nextButton = document.getElementById("next");

    let scanner = null;
    let busy = false;

    function saveBarcode(barcode) {
      return new Promise((resolve, reject) => {
        const callback =
          "cb_" + Date.now() + "_" +
          Math.random().toString(36).slice(2, 9);

        const script = document.createElement("script");
        let finished = false;

        function cleanup() {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          delete window[callback];
          script.remove();
        }

        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error(
            "No response. Check the deployment URL and access settings."
          ));
        }, 20000);

        window[callback] = function(result) {
          cleanup();

          if (result && result.ok) {
            resolve(result);
          } else {
            reject(new Error(
              result && result.error
                ? result.error
                : "Could not save the barcode."
            ));
          }
        };

        script.onerror = function() {
          cleanup();
          reject(new Error(
            "Could not contact Apps Script. Check your deployment."
          ));
        };

        script.src =
          APPS_SCRIPT_URL +
          "?barcode=" + encodeURIComponent(barcode) +
          "&key=" + encodeURIComponent(API_KEY) +
          "&callback=" + encodeURIComponent(callback) +
          "&_=" + Date.now();

        document.body.appendChild(script);
      });
    }

    async function onBarcodeDetected(decodedText) {
      if (busy) return;

      busy = true;

      try {
        await scanner.pause(true);
      } catch (error) {
        // Continue saving even if the camera cannot pause.
      }

      statusBox.textContent = "Saving barcode: " + decodedText;

      try {
        const result = await saveBarcode(decodedText);

        statusBox.textContent = "Saved successfully: " + result.barcode;
        nextButton.textContent = "Scan next product";
        nextButton.style.display = "block";

      } catch (error) {
        statusBox.textContent = "Save failed: " + error.message;
        nextButton.textContent = "Try again";
        nextButton.style.display = "block";
      }
    }

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      statusBox.textContent = "Starting camera...";

      try {
        if (!window.Html5Qrcode) {
          throw new Error("The scanner library did not load.");
        }

        scanner = new Html5Qrcode("reader", {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.ITF,
            Html5QrcodeSupportedFormats.QR_CODE
          ]
        });

        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 280, height: 130 } },
          onBarcodeDetected,
          () => {}
        );

        startButton.style.display = "none";
        statusBox.textContent = "Camera ready. Scan a barcode.";

      } catch (error) {
        scanner = null;
        startButton.disabled = false;
        statusBox.textContent =
          "Could not start camera: " + error.message +
          ". Allow camera access and try again.";
      }
    });

    nextButton.addEventListener("click", async () => {
      nextButton.style.display = "none";
      busy = false;
      statusBox.textContent = "Ready for the next barcode.";

      try {
        await scanner.resume();
      } catch (error) {
        statusBox.textContent =
          "Camera could not resume. Refresh the page and try again.";
      }
    });
  </script>
</body>
</html>
